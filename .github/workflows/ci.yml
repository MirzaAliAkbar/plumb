name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` itself, so a separate typecheck step would
      # only duplicate work.
      - name: Build (typechecks the whole program)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Contrast audit
        run: node tools/contrast.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The E2E config starts its own preview server, so this covers the axe
      # WCAG 2.2 AA scans and the offline test.
      - name: End-to-end + accessibility
        run: npx playwright test

      # design-audit.mts measures a running server, so it needs its own one.
      - name: Design audit
        run: |
          npx vite preview --port 4174 --strictPort --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4174 --timeout 60000
          npx tsx tools/design-audit.mts http://127.0.0.1:4174

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: app/test-results/
          if-no-files-found: ignore
